# Free-tier Supabase projects auto-pause after ~7 days of inactivity, which
# would take the app down silently between trips. Ping the health route every
# two days so the project stays warm. Spec 0.10.
name: Keep-alive

on:
  schedule:
    # 06:17 UTC every second day — an off-the-hour minute avoids the GitHub
    # scheduler's peak, where cron jobs get delayed or dropped.
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health route
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the APP_URL repository secret to the deployed origin."
            exit 1
          fi
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' "$APP_URL/api/health")
          echo "HTTP $status"
          cat /tmp/body.json
          test "$status" = "200"
